name: IndexNow ping

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/sitemap.xml"
  schedule:
    - cron: "0 4,16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect URLs and ping IndexNow
        run: |
          set -euo pipefail
          KEY="f4d2b7a91c63e50847bd2f9a1c6e3b50"
          HOST="dystymis.github.io"

          {
            curl -fsSL "https://$HOST/sitemap.xml"
            for s in soveti-doma zdorovie-legko avto-podskazki dacha-sad-ogorod intim-land; do
              curl -fsSL "https://$HOST/$s/sitemap.xml" || true
            done
          } | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' > urls.txt

          COUNT=$(wc -l < urls.txt)
          echo "Collected $COUNT URLs"

          jq -n \
            --arg host "$HOST" \
            --arg key "$KEY" \
            --arg keyloc "https://$HOST/$KEY.txt" \
            --rawfile urls urls.txt \
            '{host: $host, key: $key, keyLocation: $keyloc,
              urlList: ($urls | split("\n") | map(select(length > 0)))}' \
            > payload.json

          for ep in "https://api.indexnow.org/indexnow" "https://yandex.com/indexnow"; do
            code=$(curl -sS -o resp.txt -w '%{http_code}' \
              -H 'Content-Type: application/json; charset=utf-8' \
              -X POST --data @payload.json "$ep" || echo 000)
            echo "$ep -> $code $(cat resp.txt)"
          done
